[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockbot"
version = "0.1.0"
description = "Dual-bot agentic trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
stockbot = "stockbot.cli:main"
stockbot-flow-lens = "stockbot.tools.flow_lens.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stockbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
